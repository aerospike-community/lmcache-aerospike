name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pre-commit

      - name: Preflight (S0 toolchain contract)
        run: python scripts/preflight.py

      - name: Pre-commit hooks
        run: pre-commit run --all-files

      - name: Unit tests
        run: pytest tests/unit -q

  integration:
    name: Integration (Aerospike CE)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the hosted runner under ~7 GiB RAM (lmcache pulls torch).
          pip install "torch" --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest pytest-asyncio

      - name: Start Aerospike CE (Docker)
        run: |
          chmod +x scripts/start_aerospike_ce.sh scripts/stop_aerospike_ce.sh
          ./scripts/start_aerospike_ce.sh
          docker ps --filter "name=lmcache-aerospike-ci"
          cat .aerospike-ci.env

      - name: Integration tests
        run: |
          set -a
          source .aerospike-ci.env
          set +a
          pytest tests/integration -v --tb=short

      - name: Stop Aerospike CE
        if: always()
        run: ./scripts/stop_aerospike_ce.sh
